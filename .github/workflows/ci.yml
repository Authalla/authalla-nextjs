name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Check the package contents
        run: pnpm check-package

  # The example app, set up the way a new create-next-app is (Cache
  # Components on), built against this checkout's SDK and smoke-tested
  # with next start.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the example
        run: pnpm --filter authalla-nextjs-example build
      - name: Smoke-test the example
        run: pnpm --filter authalla-nextjs-example smoke
